apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-immich-user
  namespace: database
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: postgres-immich-user
    creationPolicy: Owner
    # CNPG requires basic-auth for managed role passwords.
    template:
      type: kubernetes.io/basic-auth
      data:
        username: immich
        password: "{{ .DB_PASSWORD }}"
  # Same item the app's own ExternalSecret reads, so the two cannot drift.
  dataFrom:
    - extract:
        key: immich-config
