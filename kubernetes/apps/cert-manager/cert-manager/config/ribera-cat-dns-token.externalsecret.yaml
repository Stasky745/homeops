apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ribera-cat-dns-token
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: ribera-cat-dns-token
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: cf-ribera-cat-config
