apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pocket-id-secret
  namespace: auth
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: pocket-id-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: pocket-id-config
