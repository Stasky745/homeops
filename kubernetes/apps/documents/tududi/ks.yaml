apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tududi
  namespace: flux-system
spec:
  targetNamespace: documents
  commonMetadata:
    labels:
      app.kubernetes.io/name: tududi
  dependsOn:
    - name: rook-ceph-cluster
    - name: external-secrets-clustersecretstore
    - name: pocket-id
  path: ./kubernetes/apps/documents/tududi/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: tududi
      namespace: documents
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: tududi-secret
      namespace: documents
