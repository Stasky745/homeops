---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-webhook-secret
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: github-webhook-secret
    creationPolicy: Owner
  # Field stays lowercase `token` — the Flux Receiver hardcodes that key name.
  dataFrom:
    - extract:
        key: github-webhook-config
