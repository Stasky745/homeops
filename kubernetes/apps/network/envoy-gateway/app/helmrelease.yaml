apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
  namespace: network
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: envoy-gateway
  values:
    config:
      envoyGateway:
        provider:
          type: Kubernetes
          kubernetes:
            deploy:
              type: GatewayNamespace
        # Backend CRD — lets an HTTPRoute reach a backend that serves its own
        # self-signed TLS (unifi-os-server) via tls.insecureSkipVerify.
        extensionApis:
          enableBackend: true
