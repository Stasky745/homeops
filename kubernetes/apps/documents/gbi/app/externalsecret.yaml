apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gbi-secret
  namespace: documents
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: gbi-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: gbi-config
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gbi-config
  namespace: documents
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: gbi-config
    creationPolicy: Owner
  # Keeps an explicit mapping: the key is a filename, mounted via subPath.
  data:
    - secretKey: config.yaml
      remoteRef:
        key: gbi-file-config
        property: config.yaml
