apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: flux-webhook
  namespace: flux-system
spec:
  endpoints:
    - dnsName: flux-webhook.stasky.win
      recordType: CNAME
      recordTTL: 1
      targets:
        - pangolin.stasky.win
      providerSpecific:
        - name: external-dns.alpha.kubernetes.io/cloudflare-proxied
          value: "true"
