apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyseerr
  namespace: media
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: jellyseerr
    namespace: media
  values:
    fullnameOverride: jellyseerr

    image:
      registry: ghcr.io
      repository: seerr-team/seerr
      tag: "v3.4.1"

    extraEnv:
      - name: TZ
        value: Europe/Andorra
      - name: LOG_LEVEL
        value: info

    serviceAccount:
      create: true
      automount: false

    service:
      type: ClusterIP
      port: 80

    config:
      persistence:
        size: 5Gi
        accessModes:
          - ReadWriteOnce
        storageClass: ceph-block

    ingress:
      enabled: false

    route:
      main:
        enabled: true
        apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        parentRefs:
          - name: stasky
            namespace: network
            sectionName: https
        hostnames:
          - seerr.stasky.win

    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 1Gi
