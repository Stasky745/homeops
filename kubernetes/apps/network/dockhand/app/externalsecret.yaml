apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dockhand-secret
  namespace: network
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: dockhand-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: dockhand-config
