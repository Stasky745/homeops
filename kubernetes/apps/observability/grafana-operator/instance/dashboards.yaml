# Dashboards ship as ConfigMaps from the victoria-metrics-k8s-stack chart, so
# they stay version-matched to it. Deliberately omitted: kubernetes-proxy (Cilium
# replaces kube-proxy), victoriametrics-cluster and -backupmanager (single-node,
# no backup manager), grafana-overview.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: kubernetes-views-global
  namespace: observability
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  configMapRef:
    name: vm-kubernetes-views-global
    key: kubernetes-views-global.json
---
