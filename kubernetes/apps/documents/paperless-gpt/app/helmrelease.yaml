# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless-gpt
  namespace: documents
spec:
  interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      paperless-gpt:
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/icereed/paperless-gpt
              tag: "v0.27.0"
            env:
              TZ: Europe/Andorra

              # --- paperless-ngx ---------------------------------------------
              PAPERLESS_BASE_URL: http://paperless.documents.svc.cluster.local:8000
              # Used to build links back to documents in the UI.
              PAPERLESS_PUBLIC_URL: https://paperless.stasky.win

              # --- LLM ------------------------------------------------------
              # Local inference. The Anthropic provider would be ~300x faster
              # and ~$0.015/document, but this keeps documents on the LAN.
              LLM_PROVIDER: ollama
              LLM_MODEL: qwen3:4b
              OLLAMA_HOST: http://ollama.documents.svc.cluster.local:11434
              # Mandatory for qwen3: with thinking left on, reasoning models
              # spend the whole token budget in the scratchpad and return
              # *empty* content on the strict-format calls (tags, dates).
              OLLAMA_THINK: "false"
              OLLAMA_CONTEXT_LENGTH: "8192"
              # Truncates document content before it reaches the prompt. This
              # is the single biggest lever on latency: prefill dominates, and
              # six calls are made per document.
              TOKEN_LIMIT: "2000"
              # One at a time — concurrent generation on a 3-core CPU budget
              # makes every request slower rather than finishing sooner.
              SUGGESTION_WORKERS: "1"
              # ~5-6 min/document is expected here, so bound the job rather
              # than letting a wedged generation run forever.
              SUGGESTION_JOB_TIMEOUT_SECONDS: "900"
              LLM_MAX_RETRIES: "2"
              LLM_BACKOFF_MAX_WAIT: 60s

              # --- tags -----------------------------------------------------
              # BOOTSTRAP VALUE. paperless started with no tags, and with this
              # false the tag suggestion is filtered against the (empty)
              # existing-tag list and returns nothing every time. Leave true
              # while mining the model for a vocabulary, curate the results in
              # paperless, then flip to false to stop tag sprawl — a 4B model
              # will otherwise emit Invoice/Factura/Bill as three tags.
              CREATE_NEW_TAGS: "true"

              # --- OCR ------------------------------------------------------
              # Deliberately unset: OCR_PROVIDER and VISION_LLM_PROVIDER. LLM
              # OCR on this hardware is 5-10 min *per page* and would be worse
              # than the eng+cat+spa tesseract output paperless already
              # produces. Startup logs "Vision LLM not enabled" and moves on.
              # (Searchable-PDF text layers are Google Document AI only, so
              # they are not on the table with any local provider regardless.)

              LOG_LEVEL: info
            envFrom:
              - secretRef:
                  name: paperless-gpt-secret
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                # Thin Go proxy — all the real work happens in ollama. Normal
                # priority (not low-priority) because this is the UI: if it is
                # evicted the user sees a 503, and it costs almost nothing.
                memory: 256Mi

    service:
      app:
        controller: paperless-gpt
        ports:
          http:
            port: 8080

    route:
      app:
        hostnames:
          - paperless-gpt.stasky.win
        parentRefs:
          - name: stasky
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app

    persistence:
      # Prompt templates. default_prompts/ is copied in here on first run and
      # every edit made in the Settings UI is written back, so this must persist
      # or tuned prompts are lost on restart.
      prompts:
        accessMode: ReadWriteOnce
        size: 1Gi
        storageClass: ceph-block
        retain: true
        globalMounts:
          - path: /app/prompts
      # settings.json. Note "Save as defaults" in the UI writes here and the
      # saved values then take precedence over the env vars above — the usual
      # cause of an env change appearing to be ignored.
      config:
        accessMode: ReadWriteOnce
        size: 1Gi
        storageClass: ceph-block
        retain: true
        globalMounts:
          - path: /app/config

    defaultPodOptions:
      annotations:
        reloader.stakater.com/auto: "true"
      automountServiceAccountToken: false
