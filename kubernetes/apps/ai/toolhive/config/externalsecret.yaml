apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: toolhive-secret
  namespace: ai
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: toolhive-secret
    creationPolicy: Owner
    # headerInjection takes the whole header value from one key, so the "Bearer "
    # prefix is rendered here rather than stored in 1Password.
    template:
      data:
        MEALIE_API_KEY: "{{ .MEALIE_API_KEY }}"
        TUDUDI_AUTH_HEADER: "Bearer {{ .TUDUDI_API_TOKEN }}"
        OIDC_CLIENT_SECRET: "{{ .OIDC_CLIENT_SECRET }}"
        AUTH_SIGNING_KEY: "{{ .AUTH_SIGNING_KEY }}"
        AUTH_HMAC_SECRET: "{{ .AUTH_HMAC_SECRET }}"
        REDIS_PASSWORD: "{{ .REDIS_PASSWORD }}"
  dataFrom:
    - extract:
        key: toolhive-config
