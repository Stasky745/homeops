apiVersion: toolhive.stacklok.dev/v1beta1
kind: VirtualMCPServer
metadata:
  name: homelab
  namespace: ai
spec:
  groupRef:
    name: homelab
  # Pocket ID publishes no registration_endpoint, so MCP clients cannot register
  # against it. The embedded AS provides one and delegates the actual login
  # upstream, which is what makes a bare `claude mcp add` work.
  authServerConfig:
    issuer: https://mcp.stasky.win
    # All three are required together for a restart to be survivable: without the
    # keys every issued token stops verifying, and without redis the dynamically
    # registered clients are lost, which forces `claude mcp remove` + `add`.
    signingKeySecretRefs:
      - name: toolhive-secret
        key: AUTH_SIGNING_KEY
    hmacSecretRefs:
      - name: toolhive-secret
        key: AUTH_HMAC_SECRET
    storage:
      type: redis
      redis:
        addr: redis-toolhive.database.svc.cluster.local:6379
        # usernameSecretRef omitted on purpose — the operator sets requirepass,
        # which is password-only AUTH.
        aclUserConfig:
          passwordSecretRef:
            name: toolhive-secret
            key: REDIS_PASSWORD
    upstreamProviders:
      - name: pocket-id
        type: oidc
        oidcConfig:
          issuerUrl: https://pocket-id.stasky.win
          # pocket-id.stasky.win resolves to the internal gateway (192.168.42.100),
          # which the AS's SSRF guard refuses without this.
          allowPrivateIPs: true
          # Substituted from the toolhive-settings Secret in flux-system.
          clientId: ${OIDC_CLIENT_ID}
          clientSecretRef:
            name: toolhive-secret
            key: OIDC_CLIENT_SECRET
          scopes:
            - openid
            - profile
            - email
    # Backends carry their own credentials, so the upstream token is not needed
    # downstream; this also keeps the proxy off the upstreamswap code path.
    disableUpstreamTokenInjection: true
  incomingAuth:
    type: oidc
    oidcConfigRef:
      name: vmcp-embedded
      # Trailing slash is deliberate: Claude Code derives the RFC 8707 resource
      # from the server URL origin as "https://mcp.stasky.win/", and the AS
      # compares audiences as exact strings.
      audience: https://mcp.stasky.win/
      resourceUrl: https://mcp.stasky.win/
