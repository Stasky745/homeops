# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tududi
  namespace: documents
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      tududi:
        strategy: Recreate
        containers:
          app:
            image:
              repository: chrisvel/tududi
              tag: "1.5.0"
            env:
              TZ: Europe/Andorra
              BASE_URL: https://tududi.stasky.win
              TUDUDI_ALLOWED_ORIGINS: https://tududi.stasky.win
              TUDUDI_TRUST_PROXY: "true"
              COOKIE_SECURE: auto
              TUDUDI_USER_EMAIL: toilethopes@gmail.com
              PASSWORD_AUTH_ENABLED: "false"
              DISABLE_TELEGRAM: "true"
              LOG_FORMAT: json
              FF_ENABLE_MCP: "true"
              FF_ENABLE_BACKUPS: "true"
              OIDC_ENABLED: "true"
              OIDC_PROVIDER_NAME: PocketID
              # Suffix of the callback URL registered in Pocket ID:
              # https://tududi.stasky.win/api/oidc/callback/pocketid
              OIDC_PROVIDER_SLUG: pocketid
              OIDC_ISSUER_URL: https://pocket-id.stasky.win
              OIDC_SCOPE: openid profile email
              OIDC_AUTO_PROVISION: "true"
            envFrom:
              - secretRef:
                  name: tududi-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 3002
                  periodSeconds: 30
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health/ready
                    port: 3002
                  periodSeconds: 10
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 3002
                  periodSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 50m
                memory: 192Mi
              limits:
                memory: 768Mi

    service:
      app:
        controller: tududi
        ports:
          http:
            port: 3002

    # One claim, three subPaths: a changing chart-created PVC count renames the
    # existing claims (see the orphaned paperless PVCs).
    persistence:
      data:
        accessMode: ReadWriteOnce
        size: 5Gi
        storageClass: ceph-block
        retain: true
        globalMounts:
          - path: /app/db
            subPath: db
          - path: /app/uploads
            subPath: uploads
          - path: /app/backups
            subPath: backups

    route:
      app:
        hostnames:
          - tududi.stasky.win
        parentRefs:
          - name: stasky
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app

    defaultPodOptions:
      annotations:
        reloader.stakater.com/auto: "true"
      automountServiceAccountToken: false
      # The entrypoint chowns the mounted volume as root before dropping to
      # 1001 via su-exec, so it must not be forced non-root.
      securityContext:
        fsGroup: 1001
