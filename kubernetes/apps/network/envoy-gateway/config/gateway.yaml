---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: stasky-client-policy
  namespace: network
spec:
  # http3 removed 2026-09-25. It made Envoy advertise `alt-svc: h3=":443"` with a
  # 24 h max-age, so browsers moved to QUIC and long-lived connections broke:
  # Syncthing's event long-poll and Dockhand's WebSocket both dropped every few
  # seconds. Plain requests over h3 worked, so it is specifically the long-lived
  # case — WebSocket over HTTP/3 needs Extended CONNECT (RFC 9220), which this
  # path does not appear to negotiate. HTTP/2 over TCP measured 20/20 stable, and
  # h3 buys nothing on a LAN, where its wins (loss, high RTT) do not apply.
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: stasky
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: stasky
  namespace: network
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        externalTrafficPolicy: Cluster
        annotations:
          io.cilium/lb-ipam-ips: "192.168.42.100"
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: stasky
  namespace: network
spec:
  gatewayClassName: envoy
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: stasky
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: stasky-win-wildcard-tls
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: ribera
  namespace: network
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        externalTrafficPolicy: Cluster
        annotations:
          io.cilium/lb-ipam-ips: "192.168.42.101"
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ribera
  namespace: network
  annotations:
    # external-dns reads target from the Gateway, not the Route. Without it,
    # the private LB IP would be published publicly.
    # vps.stasky.win, not pangolin.stasky.win: the latter is orange-clouded, and
    # a CNAME to it puts video through Cloudflare's proxy (ToS 2.8) and adds the
    # ECH records that break LAN browsers. Same VPS, Traefik routes by Host.
    external-dns.alpha.kubernetes.io/target: vps.stasky.win
spec:
  gatewayClassName: envoy
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: ribera
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: ribera-cat-wildcard-tls
      allowedRoutes:
        namespaces:
          from: All
