# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qui
  namespace: media
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      qui:
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/autobrr/qui
              tag: "v1.25.0"
            env:
              QUI__HOST: 0.0.0.0
              QUI__PORT: "8080"
              QUI__LOG_LEVEL: INFO
              QUI__OIDC_ENABLED: "true"
              QUI__OIDC_ISSUER: https://pocket-id.stasky.win
              QUI__OIDC_REDIRECT_URL: https://qui.stasky.win/api/auth/oidc/callback
              QUI__OIDC_DISABLE_BUILT_IN_LOGIN: "true"
            envFrom:
              - secretRef:
                  name: qui-oidc
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi

    defaultPodOptions:
      annotations:
        reloader.stakater.com/auto: "true"
      automountServiceAccountToken: false

    service:
      app:
        controller: qui
        ports:
          http:
            port: 8080

    route:
      app:
        hostnames:
          - qui.stasky.win
        parentRefs:
          - name: stasky
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app

    persistence:
      config:
        accessMode: ReadWriteOnce
        size: 1Gi
        storageClass: ceph-block
        retain: true
        globalMounts:
          - path: /config
