# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gluetun-test
  namespace: media
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      gluetun-test:
        strategy: Recreate
        containers:
          app:
            image:
              repository: qmcgaw/gluetun
              tag: "v3.40.0"
            env:
              VPN_SERVICE_PROVIDER: mullvad
              VPN_TYPE: wireguard
              SERVER_CITIES: Prague,Berlin,Amsterdam
              OWNED_ONLY: yes
              FIREWALL_OUTBOUND_SUBNETS: "10.244.0.0/22,192.168.42.0/24"
            envFrom:
              - secretRef:
                  name: gluetun-test-vpn-secret
            securityContext:
              capabilities:
                add: ["NET_ADMIN"]
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 256Mi

    defaultPodOptions:
      annotations:
        reloader.stakater.com/auto: "true"
      automountServiceAccountToken: false
