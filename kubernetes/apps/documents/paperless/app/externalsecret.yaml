apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-secret
  namespace: documents
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: paperless-secret
    creationPolicy: Owner
    # PAPERLESS_SOCIALACCOUNT_PROVIDERS is a single JSON blob that embeds the
    # OIDC client secret, so it cannot live in git. Only its two credential
    # fields come from 1Password — the rest of the shape stays reviewable here.
    # Note: when a template is present, the rendered keys are the *only* keys in
    # the resulting Secret, so every value paperless needs is templated below.
    template:
      engine: v2
      data:
        PAPERLESS_SECRET_KEY: "{{ .secret_key }}"
        PAPERLESS_ADMIN_USER: "{{ .admin_user }}"
        PAPERLESS_ADMIN_PASSWORD: "{{ .admin_password }}"
        PAPERLESS_SOCIALACCOUNT_PROVIDERS: |-
          {"openid_connect":{"SCOPE":["openid","profile","email"],"OAUTH_PKCE_ENABLED":true,"APPS":[{"provider_id":"pocket-id","name":"Pocket ID","client_id":"{{ .client_id }}","secret":"{{ .client_secret }}","settings":{"server_url":"https://pocket-id.stasky.win"}}]}}
  data:
    - secretKey: secret_key
      remoteRef:
        key: Paperless
        property: secret_key
    - secretKey: admin_user
      remoteRef:
        key: Paperless
        property: admin_user
    - secretKey: admin_password
      remoteRef:
        key: Paperless
        property: admin_password
    - secretKey: client_id
      remoteRef:
        key: Paperless
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: Paperless
        property: client_secret
