apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPExternalAuthConfig
metadata:
  name: tududi-token
  namespace: ai
spec:
  # Not bearerToken: vMCP registers converters for tokenExchange, headerInjection,
  # unauthenticated, upstreamInject, awsSts, obo and xaa only — bearerToken is
  # accepted by the CRD but rejected at runtime as an unsupported backend type.
  type: headerInjection
  headerInjection:
    headerName: Authorization
    valueSecretRef:
      name: toolhive-secret
      key: TUDUDI_AUTH_HEADER
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServerEntry
metadata:
  name: tududi
  namespace: ai
spec:
  groupRef:
    name: homelab
  # tududi hosts its own MCP endpoint, so it is registered as a remote entry
  # rather than a container ToolHive runs.
  remoteUrl: http://tududi.documents.svc.cluster.local:3002/api/mcp
  transport: streamable-http
  allowPrivateEndpoint: true
  externalAuthConfigRef:
    name: tududi-token
