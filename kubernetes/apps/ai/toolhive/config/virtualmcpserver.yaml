apiVersion: toolhive.stacklok.dev/v1beta1
kind: VirtualMCPServer
metadata:
  name: homelab
  namespace: ai
spec:
  groupRef:
    name: homelab
  incomingAuth:
    type: oidc
    oidcConfigRef:
      name: pocket-id
      # The Pocket ID API resource identifier. The CRD requires this to be unique
      # per server: it is what stops a token minted for another app being replayed
      # here. resourceUrl is advertised for RFC 9728 discovery — the default would
      # be the in-cluster Service URL, which no browser can reach.
      audience: https://mcp.stasky.win
      resourceUrl: https://mcp.stasky.win
