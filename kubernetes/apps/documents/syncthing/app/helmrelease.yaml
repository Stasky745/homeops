# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: syncthing
  namespace: documents
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      syncthing:
        containers:
          app:
            image:
              repository: syncthing/syncthing
              tag: "2.1.2"
            env:
              TZ: Europe/Andorra
              # Bind GUI to all interfaces so the Service can reach it
              STGUIADDRESS: 0.0.0.0:8384
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /rest/noauth/health
                    port: 8384
                  initialDelaySeconds: 10
                  periodSeconds: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /rest/noauth/health
                    port: 8384
                  initialDelaySeconds: 10
                  periodSeconds: 10
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi

    service:
      app:
        controller: syncthing
        ports:
          http:
            port: 8384
      # Sync protocol — configure 192.168.42.102:22000 as a static address
      # on the laptop's Syncthing device entry for direct LAN/VPN sync.
      sync:
        controller: syncthing
        type: LoadBalancer
        annotations:
          io.cilium/lb-ipam-ips: "192.168.42.102"
        ports:
          sync:
            port: 22000
            protocol: TCP

    route:
      app:
        hostnames:
          - syncthing.stasky.win
        parentRefs:
          - name: stasky
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app

    persistence:
      # Syncthing config, device identity, and index DB — small, needs no RWX
      config:
        accessMode: ReadWriteOnce
        size: 1Gi
        storageClass: ceph-block
        globalMounts:
          - path: /var/syncthing
      # Obsidian vault — backed up by NAS Restic (tank/k8s)
      obsidian:
        accessMode: ReadWriteMany
        size: 20Gi
        storageClass: nfs
        retain: true
        globalMounts:
          - path: /data/obsidian
      # Shared inbox: Syncthing writes here, Paperless consumes from here
      consume:
        existingClaim: consume
        globalMounts:
          - path: /data/consume

    defaultPodOptions:
      automountServiceAccountToken: false
