apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: toolhive-operator
  namespace: ai
spec:
  interval: 1h
  timeout: 5m
  chartRef:
    kind: OCIRepository
    name: toolhive-operator
    namespace: ai
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    operator:
      rbac:
        scope: namespace
        allowedNamespaces:
          - ai
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi
