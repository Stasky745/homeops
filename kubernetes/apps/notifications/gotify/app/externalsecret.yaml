apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gotify-secret
  namespace: notifications
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: gotify-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: gotify-config
