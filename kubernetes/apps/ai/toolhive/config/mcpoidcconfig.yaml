apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPOIDCConfig
metadata:
  name: vmcp-embedded
  namespace: ai
spec:
  type: inline
  inline:
    # vMCP's own embedded authorization server, not Pocket ID: the issuer must
    # match authServerConfig.issuer so the tokens it mints validate here.
    issuer: https://mcp.stasky.win
