apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: redis-paperless
  namespace: flux-system
spec:
  targetNamespace: database
  commonMetadata:
    labels:
      app.kubernetes.io/name: redis-paperless
  dependsOn:
    - name: redis-operator
    - name: rook-ceph-cluster
  path: ./kubernetes/apps/database/redis-paperless/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: redis-paperless
      namespace: database
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: OCIRepository
      name: redis-paperless
      namespace: database
