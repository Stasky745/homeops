---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-gpt-secret
  namespace: documents
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: paperless-gpt-secret
    creationPolicy: Owner
  # Generate the token in the paperless-ngx Django admin (Auth Tokens) for a
  # dedicated user — regular login is disabled there, so reach the admin via SSO.
  dataFrom:
    - extract:
        key: paperless-gpt-config
---
# Separate Secret, same 1Password item: Envoy Gateway looks up fixed key names —
# `client-id` for oidc.clientIDRef and `client-secret` for oidc.clientSecret —
# rather than accepting arbitrary keys. The template remaps the ENV-named fields
# onto those names.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-gpt-oidc
  namespace: documents
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: paperless-gpt-oidc
    creationPolicy: Owner
    template:
      data:
        client-id: "{{ .OIDC_CLIENT_ID }}"
        client-secret: "{{ .OIDC_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: paperless-gpt-config
