---
# Envoy Gateway defaults routes to 15s, which covers the whole response and so
# cuts SSE, long polls and slow transfers. 0s disables it; the per-stream idle
# timeout still reaps hung requests. Route-level policies still override.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: no-request-timeout
  namespace: network
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: stasky
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ribera
  timeout:
    http:
      requestTimeout: 0s
