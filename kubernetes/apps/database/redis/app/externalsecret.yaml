apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redis-toolhive-auth
  namespace: database
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: redis-toolhive-auth
    creationPolicy: Owner
    # Only the password: the rest of toolhive-config is for the ai namespace.
    template:
      data:
        password: "{{ .REDIS_PASSWORD }}"
  dataFrom:
    - extract:
        key: toolhive-config
