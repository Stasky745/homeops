spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ${ACME_EMAIL}
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
        selector:
          dnsZones:
            - stasky.win
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: ribera-cat-dns-token
              key: api-token
        selector:
          dnsZones:
            - ribera.cat
