apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gbi
  namespace: flux-system
spec:
  targetNamespace: documents
  commonMetadata:
    labels:
      app.kubernetes.io/name: gbi
  dependsOn:
    - name: app-template
    - name: external-secrets-clustersecretstore
    - name: pocket-id
    - name: gotify
    - name: rook-ceph-cluster
  path: ./kubernetes/apps/documents/gbi/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: gbi
      namespace: documents
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: gbi-secret
      namespace: documents
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: gbi-config
      namespace: documents
