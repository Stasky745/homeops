apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: profilarr-secret
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: profilarr-secret
    creationPolicy: Owner
  data:
    - secretKey: OIDC_CLIENT_ID
      remoteRef:
        key: profilarr
        property: client_id
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: profilarr
        property: client_secret
    - secretKey: PROFILARR_API_KEY
      remoteRef:
        key: profilarr
        property: api_key
