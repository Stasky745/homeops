apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-secret
  namespace: photos
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: immich-secret
    creationPolicy: Owner
  data:
    # Same 1Password field the CNPG managed role reads, so the two cannot drift.
    - secretKey: DB_PASSWORD
      remoteRef:
        key: Immich
        property: db_password
