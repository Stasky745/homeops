# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gotify
  namespace: notifications
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      gotify:
        strategy: Recreate
        containers:
          app:
            image:
              repository: gotify/server
              tag: "3.0.0"
            env:
              TZ: Europe/Andorra
              GOTIFY_SERVER_PORT: "80"
              GOTIFY_SERVER_TRUSTEDPROXIES: 10.244.0.0/22
              GOTIFY_SERVER_SECURECOOKIE: "true"
              GOTIFY_DEFAULTUSER_NAME: admin
              GOTIFY_REGISTRATION: "false"
              GOTIFY_OIDC_ENABLED: "true"
              GOTIFY_OIDC_ISSUER: https://pocket-id.stasky.win
              GOTIFY_OIDC_REDIRECTURL: https://gotify.stasky.win/auth/oidc/callback
              GOTIFY_OIDC_AUTOREGISTER: "true"
              GOTIFY_OIDC_USERNAMECLAIM: preferred_username
              GOTIFY_OIDC_SCOPES: openid,profile,email
            envFrom:
              - secretRef:
                  name: gotify-secret
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 256Mi

    service:
      app:
        controller: gotify
        ports:
          http:
            port: 80

    persistence:
      data:
        accessMode: ReadWriteOnce
        size: 1Gi
        storageClass: ceph-block
        retain: true
        globalMounts:
          - path: /app/data

    route:
      app:
        hostnames:
          - gotify.stasky.win
        parentRefs:
          - name: stasky
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: gotify
                port: 80

    defaultPodOptions:
      automountServiceAccountToken: false
