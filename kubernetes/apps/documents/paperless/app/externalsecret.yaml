apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-secret
  namespace: documents
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: paperless-secret
    creationPolicy: Owner
    # PAPERLESS_SOCIALACCOUNT_PROVIDERS is a single JSON blob that embeds the
    # OIDC client secret, so it cannot live in git. When a template is present
    # the rendered keys are the *only* keys in the Secret, so everything
    # paperless needs is templated below.
    template:
      data:
        PAPERLESS_SECRET_KEY: "{{ .PAPERLESS_SECRET_KEY }}"
        PAPERLESS_ADMIN_USER: "{{ .PAPERLESS_ADMIN_USER }}"
        PAPERLESS_ADMIN_PASSWORD: "{{ .PAPERLESS_ADMIN_PASSWORD }}"
        PAPERLESS_SOCIALACCOUNT_PROVIDERS: |-
          {"openid_connect":{"SCOPE":["openid","profile","email"],"OAUTH_PKCE_ENABLED":true,"APPS":[{"provider_id":"pocket-id","name":"Pocket ID","client_id":"{{ .OIDC_CLIENT_ID }}","secret":"{{ .OIDC_CLIENT_SECRET }}","settings":{"server_url":"https://pocket-id.stasky.win"}}]}}
  dataFrom:
    - extract:
        key: paperless-config
