# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: intel-gpu-plugin
  namespace: kube-system
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      intel-gpu-plugin:
        type: daemonset
        containers:
          app:
            image:
              repository: intel/intel-gpu-plugin
              tag: "0.36.0"
            args:
              - -shared-dev-num
              - "4"   # jellyfin + immich (transcode + OpenVINO ML)
            env:
              NODE_NAME:
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 40m
                memory: 45Mi
              limits:
                memory: 90Mi

    defaultPodOptions:
      nodeSelector:
        kubernetes.io/arch: amd64
      securityContext:
        seccompProfile:
          type: RuntimeDefault

    persistence:
      devfs:
        type: hostPath
        hostPath: /dev/dri
        globalMounts:
          - path: /dev/dri
            readOnly: true
      sysfsdrm:
        type: hostPath
        hostPath: /sys/class/drm
        globalMounts:
          - path: /sys/class/drm
            readOnly: true
      kubeletsockets:   # kubelet registration socket — must be writable
        type: hostPath
        hostPath: /var/lib/kubelet/device-plugins
        globalMounts:
          - path: /var/lib/kubelet/device-plugins
      cdipath:
        type: hostPath
        hostPath: /var/run/cdi
        hostPathType: DirectoryOrCreate
        globalMounts:
          - path: /var/run/cdi
