# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sonarr-anime
  namespace: media
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      sonarr-anime:
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/linuxserver/sonarr
              tag: "4.0.19.2979-ls320"
            env:
              PUID: "1000"
              PGID: "1000"
              UMASK: "002"
              TZ: Europe/Andorra
              DOCKER_MODS: linuxserver/mods:universal-package-install
              INSTALL_PACKAGES: mkvtoolnix|python3
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            resources:
              requests:
                cpu: 20m
                memory: 4Gi
              limits:
                memory: 4Gi

    defaultPodOptions:
      annotations:
        reloader.stakater.com/auto: "true"
      automountServiceAccountToken: false

    service:
      app:
        controller: sonarr-anime
        ports:
          http:
            port: 8989

    route:
      app:
        hostnames:
          - sonarr-anime.stasky.win
        parentRefs:
          - name: stasky
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app

    persistence:
      anime-tracks:
        type: configMap
        name: anime-tracks
        defaultMode: 0555
        globalMounts:
          - path: /config/scripts
      config:
        accessMode: ReadWriteOnce
        size: 2Gi
        storageClass: ceph-block
        retain: true
        globalMounts:
          - path: /config
      media:
        type: nfs
        server: 192.168.42.20
        path: /tank/data
        globalMounts:
          - path: /data
