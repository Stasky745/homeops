apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: paperless-gpt
  namespace: flux-system
spec:
  targetNamespace: documents
  commonMetadata:
    labels:
      app.kubernetes.io/name: paperless-gpt
  dependsOn:
    - name: app-template
    - name: external-secrets-clustersecretstore
    # Covers envoy-gateway itself (SecurityPolicy CRD) plus the stasky Gateway
    # and its wildcard cert, which the route's parentRef needs.
    - name: envoy-gateway-config
    - name: ollama
    - name: paperless
    - name: pocket-id
    - name: rook-ceph-cluster
  path: ./kubernetes/apps/documents/paperless-gpt/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  interval: 30m
  retryInterval: 1m
  timeout: 10m
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: paperless-gpt
      namespace: documents
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: paperless-gpt-secret
      namespace: documents
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      name: paperless-gpt-oidc
      namespace: documents
