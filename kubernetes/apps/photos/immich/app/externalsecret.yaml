apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-secret
  namespace: photos
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: immich-secret
    creationPolicy: Owner
  # Same item the CNPG managed role reads, so the two cannot drift.
  dataFrom:
    - extract:
        key: immich-config
