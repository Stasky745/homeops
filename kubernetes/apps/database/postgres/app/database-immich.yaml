apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: immich
  namespace: database
spec:
  name: immich
  owner: immich
  cluster:
    name: postgres
  # retain, not delete: removing this manifest must never drop the photo metadata.
  databaseReclaimPolicy: retain
  extensions:
    - name: vector
      ensure: present
    - name: vchord
      ensure: present
    - name: earthdistance
      ensure: present
    - name: cube
      ensure: present
