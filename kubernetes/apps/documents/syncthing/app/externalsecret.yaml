apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: syncthing-secret
  namespace: documents
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: syncthing-secret
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: Syncthing
        property: username
    - secretKey: password
      remoteRef:
        key: Syncthing
        property: password
    - secretKey: api_key
      remoteRef:
        key: Syncthing
        property: api_key
