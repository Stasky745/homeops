apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tududi-secret
  namespace: documents
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: tududi-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: tududi-config
