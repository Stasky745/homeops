# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: democratic-csi
  namespace: storage
spec:
  interval: 1h
  chart:
    spec:
      chart: democratic-csi
      version: "0.15.1"
      sourceRef:
        kind: HelmRepository
        name: democratic-csi
        namespace: storage
  # Inject SSH private key from the ExternalSecret into driver config.
  # The key at ssh-privatekey is mounted and referenced via valuesFrom.
  valuesFrom:
    - kind: Secret
      name: democratic-csi-ssh-key
      valuesKey: ssh-privatekey
      targetPath: driver.config.sshConnection.privateKey
  values:
    csiDriver:
      name: nfs.democratic-csi.robin

    # Two StorageClasses:
    #   nfs            → tank/k8s       (restic-backed; use for configs, databases, app state)
    #   nfs-no-backup  → tank/k8s-bulk  (snapshots only; use for Jellyfin library, downloads)
    storageClasses:
      - name: nfs
        defaultClass: false
        reclaimPolicy: Retain
        volumeBindingMode: Immediate
        allowVolumeExpansion: true
        parameters:
          fsType: nfs
          datasetParentName: tank/k8s
      - name: nfs-no-backup
        defaultClass: false
        reclaimPolicy: Retain
        volumeBindingMode: Immediate
        allowVolumeExpansion: true
        parameters:
          fsType: nfs
          datasetParentName: tank/k8s-bulk

    volumeSnapshotClasses:
      - name: zfs-nfs
        deletionPolicy: Delete
        parameters:
          detachedSnapshots: "true"

    driver:
      config:
        driver: zfs-generic-nfs

        sshConnection:
          host: 192.168.42.20
          port: 22
          username: democratic-csi
          # privateKey injected via valuesFrom above

        zfs:
          cli:
            sudoEnabled: true
            paths:
              zfs: /sbin/zfs
              zpool: /sbin/zpool
              sudo: /usr/bin/sudo
              exportfs: /usr/sbin/exportfs
          # Default parent — overridden per StorageClass via parameters.datasetParentName
          datasetParentName: tank/k8s
          # Detached snapshots are stored here (separate from live datasets)
          detachedSnapshotsDatasetParentName: tank/k8s-snaps
          datasetEnableQuotas: true
          datasetEnableReservation: false

        nfs:
          shareHost: 192.168.42.20
          # Set sharenfs property on each ZFS dataset — zfs-share exports it automatically
          shareStrategy: setDatasetProperties
          shareStrategySetDatasetProperties:
            properties:
              # Export each PVC dataset to the servers VLAN only
              sharenfs: "rw=@192.168.42.0/24,no_subtree_check,no_root_squash"

        nfsVersion: 4
        mountOptions:
          - nfsvers=4.1
          - hard
          - timeo=600
