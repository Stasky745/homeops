apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: victus-secret
  namespace: food
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: victus-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: victus-config
