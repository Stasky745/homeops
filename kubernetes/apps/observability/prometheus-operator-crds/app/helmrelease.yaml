apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-operator-crds
  namespace: observability
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: prometheus-operator-crds
  # Installed for VictoriaMetrics' operator, which converts ServiceMonitor and
  # PrometheusRule into VMServiceScrape and VMRule — so charts that ship those
  # (rook-ceph, cilium) work unchanged. No Prometheus operator ever runs here.
  values: {}
