apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPExternalAuthConfig
metadata:
  name: tududi-token
  namespace: ai
spec:
  type: bearerToken
  bearerToken:
    # Stored without the "Bearer " prefix; the proxy adds it.
    tokenSecretRef:
      name: toolhive-secret
      key: TUDUDI_API_TOKEN
---
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServerEntry
metadata:
  name: tududi
  namespace: ai
spec:
  groupRef:
    name: homelab
  # tududi hosts its own MCP endpoint, so it is registered as a remote entry
  # rather than a container ToolHive runs.
  remoteUrl: http://tududi.documents.svc.cluster.local:3002/api/mcp
  transport: streamable-http
  allowPrivateEndpoint: true
  externalAuthConfigRef:
    name: tududi-token
