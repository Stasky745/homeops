apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sabnzbd-vpn-secret
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: sabnzbd-vpn-secret
    creationPolicy: Owner
  data:
    - secretKey: WIREGUARD_PRIVATE_KEY
      remoteRef:
        key: Mullvad - SABnzbd
        property: private-key
    - secretKey: WIREGUARD_ADDRESSES
      remoteRef:
        key: Mullvad - SABnzbd
        property: address
