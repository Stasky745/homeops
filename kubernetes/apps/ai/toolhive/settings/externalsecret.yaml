apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: toolhive-settings
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: toolhive-settings
    creationPolicy: Owner
    # A template makes the rendered keys the only keys, so the API tokens in the
    # same 1Password item stay out of flux-system.
    template:
      data:
        OIDC_CLIENT_ID: "{{ .OIDC_CLIENT_ID }}"
  dataFrom:
    - extract:
        key: toolhive-config
