apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbird-api-key
  namespace: netbird
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: netbird-mgmt-api-key
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: netbird-config
