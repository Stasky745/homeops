# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dockhand
  namespace: network
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      dockhand:
        strategy: Recreate
        containers:
          app:
            image:
              repository: fnsys/dockhand
              tag: "v1.0.40"
            env:
              DATA_DIR: /app/data
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi

    service:
      app:
        controller: dockhand
        ports:
          http:
            port: 3000

    persistence:
      data:
        accessMode: ReadWriteOnce
        size: 1Gi
        storageClass: ceph-block
        retain: true
        globalMounts:
          - path: /app/data

    route:
      app:
        hostnames:
          - dockhand.stasky.win
        parentRefs:
          - name: stasky
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: dockhand
                port: 3000

    defaultPodOptions:
      automountServiceAccountToken: false
