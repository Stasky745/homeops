apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: observability
spec:
  parentRefs:
    - name: stasky
      namespace: network
      sectionName: https
  hostnames:
    - grafana.stasky.win
  rules:
    - backendRefs:
        - name: grafana-service
          port: 3000
