apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: network
spec:
  interval: 1h
  chart:
    spec:
      chart: external-dns
      version: "1.21.1"
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: network
  values:
    podAnnotations:
      reloader.stakater.com/auto: "true"

    provider:
      name: cloudflare

    sources:
      - crd
      - gateway-httproute

    # Scope the Gateway API source to the `ribera` gateway only. HTTPRoutes on
    # the `stasky` gateway are covered by the *.stasky.win wildcard and must not
    # get individual records.
    #
    # label-filter makes publication opt-in: nothing gets a record unless it is
    # labelled. Applies to ALL sources, so DNSEndpoints need the label too.
    extraArgs:
      - --gateway-name=ribera
      - --gateway-namespace=network
      - --label-filter=external-dns.stasky.win/publish=true

    domainFilters:
      - stasky.win
      - ribera.cat

    policy: sync
    txtOwnerId: homeops-external-dns

    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: external-dns-cloudflare
            key: cloudflare-api-token

    serviceAccount:
      create: true

    rbac:
      create: true

    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi
