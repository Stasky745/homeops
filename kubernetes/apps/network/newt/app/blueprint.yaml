public-resources:
  flux-webhook:
    name: Flux Webhook
    mode: http
    full-domain: flux-webhook.stasky.win
    targets:
      - site: lanky-little-blue-penguin
        hostname: webhook-receiver.flux-system.svc.cluster.local
        port: 80
        method: http
  dockhand:
    name: Dockhand
    mode: http
    full-domain: dockhand.stasky.win
    targets:
      - site: lanky-little-blue-penguin
        hostname: dockhand.network.svc.cluster.local
        port: 3000
        method: http
